<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Finance Tracker</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #4361ee;
            --secondary-color: #3f37c9;
            --success-color: #06ffa5;
            --danger-color: #ff006e;
            --warning-color: #ffbe0b;
            --dark-color: #2b2d42;
            --light-color: #f8f9fa;
            --gray-color: #6c757d;
            --white-color: #ffffff;
            --shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            --shadow-hover: 0 8px 15px rgba(0, 0, 0, 0.1);
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f5f7fb;
            color: var(--dark-color);
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: var(--white-color);
            padding: 20px 30px;
            border-radius: 12px;
            box-shadow: var(--shadow);
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 2rem;
            font-weight: 700;
            display: flex;
            align-items: center;
        }

        header h1 i {
            margin-right: 15px;
            font-size: 1.8rem;
        }

        .user-info {
            display: flex;
            align-items: center;
        }

        #user-role {
            margin-right: 15px;
            font-weight: 500;
            padding: 8px 15px;
            background-color: rgba(255, 255, 255, 0.2);
            border-radius: 20px;
        }

        .btn {
            background-color: var(--white-color);
            color: var(--primary-color);
            border: none;
            padding: 10px 20px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 600;
            transition: var(--transition);
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-hover);
        }

        .logout-btn {
            background-color: rgba(255, 255, 255, 0.2);
            color: var(--white-color);
        }

        .logout-btn:hover {
            background-color: rgba(255, 255, 255, 0.3);
        }

        .summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
            margin-bottom: 30px;
        }

        .card {
            background-color: var(--white-color);
            border-radius: 12px;
            padding: 25px;
            box-shadow: var(--shadow);
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 5px;
        }

        .income-card::before {
            background-color: var(--success-color);
        }

        .expense-card::before {
            background-color: var(--danger-color);
        }

        .balance-card::before {
            background-color: var(--primary-color);
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-hover);
        }

        .card h3 {
            font-size: 1.2rem;
            margin-bottom: 15px;
            color: var(--gray-color);
            display: flex;
            align-items: center;
        }

        .card h3 i {
            margin-right: 10px;
            font-size: 1.4rem;
        }

        .income-card h3 i {
            color: var(--success-color);
        }

        .expense-card h3 i {
            color: var(--danger-color);
        }

        .balance-card h3 i {
            color: var(--primary-color);
        }

        .card p {
            font-size: 2rem;
            font-weight: 700;
        }

        .income-card p {
            color: var(--success-color);
        }

        .expense-card p {
            color: var(--danger-color);
        }

        .balance-card p {
            color: var(--primary-color);
        }

        .transaction-form {
            background-color: var(--white-color);
            border-radius: 12px;
            padding: 30px;
            box-shadow: var(--shadow);
            margin-bottom: 30px;
        }

        .transaction-form h2 {
            font-size: 1.5rem;
            margin-bottom: 25px;
            color: var(--dark-color);
            display: flex;
            align-items: center;
        }

        .transaction-form h2 i {
            margin-right: 10px;
            color: var(--primary-color);
        }

        .form-control {
            margin-bottom: 20px;
        }

        .form-control label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--dark-color);
        }

        .form-control input,
        .form-control select {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            transition: var(--transition);
        }

        .form-control input:focus,
        .form-control select:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(67, 97, 238, 0.1);
        }

        .form-buttons {
            display: flex;
            gap: 15px;
            margin-top: 10px;
        }

        .form-buttons .btn {
            background-color: var(--primary-color);
            color: var(--white-color);
        }

        .form-buttons .btn:hover {
            background-color: var(--secondary-color);
        }

        .cancel-btn {
            background-color: var(--gray-color) !important;
        }

        .cancel-btn:hover {
            background-color: #5a6268 !important;
        }

        .transaction-history {
            background-color: var(--white-color);
            border-radius: 12px;
            padding: 30px;
            box-shadow: var(--shadow);
        }

        .transaction-history h2 {
            font-size: 1.5rem;
            margin-bottom: 25px;
            color: var(--dark-color);
            display: flex;
            align-items: center;
        }

        .transaction-history h2 i {
            margin-right: 10px;
            color: var(--primary-color);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        table thead {
            background-color: #f8f9fa;
        }

        table th {
            padding: 15px;
            text-align: left;
            font-weight: 600;
            color: var(--dark-color);
            border-bottom: 2px solid #eee;
        }

        table td {
            padding: 15px;
            border-bottom: 1px solid #eee;
        }

        table tbody tr {
            transition: var(--transition);
        }

        table tbody tr:hover {
            background-color: #f8f9fa;
        }

        .income {
            color: var(--success-color);
            font-weight: 600;
        }

        .expense {
            color: var(--danger-color);
            font-weight: 600;
        }

        .action-btns {
            display: flex;
            gap: 10px;
        }

        .edit-btn, .delete-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1rem;
            transition: var(--transition);
            padding: 5px 10px;
            border-radius: 5px;
        }

        .edit-btn {
            color: var(--primary-color);
        }

        .edit-btn:hover {
            background-color: rgba(67, 97, 238, 0.1);
        }

        .delete-btn {
            color: var(--danger-color);
        }

        .delete-btn:hover {
            background-color: rgba(255, 0, 110, 0.1);
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: var(--gray-color);
        }

        .empty-state i {
            font-size: 3rem;
            margin-bottom: 15px;
            color: #ddd;
        }

        .hidden {
            display: none !important;
        }

        @media (max-width: 768px) {
            header {
                flex-direction: column;
                text-align: center;
            }

            header h1 {
                margin-bottom: 15px;
            }

            .user-info {
                width: 100%;
                justify-content: center;
            }

            .summary {
                grid-template-columns: 1fr;
            }

            .form-buttons {
                flex-direction: column;
            }

            table {
                font-size: 0.9rem;
            }

            table th, table td {
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-wallet"></i> Personal Finance Tracker</h1>
            <div class="user-info">
                <span id="user-role"></span>
                <button id="create-user-btn" class="btn" style="display: none; margin-right: 10px;">Create User</button>
                <button id="logout-btn" class="btn logout-btn">Logout</button>
            </div>
        </header>

        <section class="summary" id="summary-section">
            <div class="card income-card">
                <h3><i class="fas fa-arrow-up"></i> Total Income</h3>
                <p id="total-income">0.00</p>
            </div>
            <div class="card expense-card">
                <h3><i class="fas fa-arrow-down"></i> Total Expenses</h3>
                <p id="total-expenses">0.00</p>
            </div>
            <div class="card balance-card">
                <h3><i class="fas fa-balance-scale"></i> Balance</h3>
                <p id="balance">0.00</p>
            </div>
        </section>

        <section class="transaction-form">
            <h2><i class="fas fa-plus-circle"></i> Add New Transaction</h2>
            <form id="add-transaction-form">
               
                <div class="form-control">
                    <label for="amount">Amount</label>
                    <input type="number" id="amount" name="amount" placeholder="Enter amount..." step="0.01" required>
                </div>
                 <div class="form-control">
                    <label for="description">Description</label>
                    <input type="text" id="description" name="description" placeholder="Enter description..." required>
                </div>
                <div class="form-control">
                    <label for="type">Type</label>
                    <select id="type" name="type" required>
                        <option value="income">Income</option>
                        <option value="expense">Expense</option>
                    </select>
                </div>
                <div class="form-control">
                    <label for="date">Date</label>
                    <input type="date" id="date" name="date" required>
                </div>
                <div class="form-buttons">
                    <button type="submit" class="btn">Add Transaction</button>
                    <button type="button" id="cancel-edit-btn" class="btn cancel-btn" style="display: none;">Cancel</button>
                </div>
            </form>
        </section>

        <section class="transaction-history" id="history-section">
            <h2><i class="fas fa-history"></i> Transaction History</h2>
            <table>
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Description</th>
                        <th>Amount</th>
                        <th>Type</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="transaction-list">
                    <!-- Transactions will be inserted here by JavaScript -->
                    <tr class="empty-state">
                        <td colspan="5">
                            <i class="fas fa-inbox"></i>
                            <p>No transactions yet. Add your first transaction above!</p>
                        </td>
                    </tr>
                </tbody>
            </table>
        </section>
    </div>

    <script src="auth.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
